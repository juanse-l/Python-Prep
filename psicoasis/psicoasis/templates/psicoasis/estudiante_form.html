{% extends 'psicoasis/base.html' %}
{% block title %}{{ titulo }} — PsicoAsis{% endblock %}
{% block topbar_title %}{{ titulo }}{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ titulo }}</h1>
  <p>Completa la información del estudiante</p>
</div>

<div style="max-width:700px">
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Nombre *</label>
            <input type="text" name="nombre" class="form-control" value="{{ form.nombre.value|default:'' }}" required placeholder="Nombre del estudiante">
          </div>
          <div class="form-group">
            <label class="form-label">Apellido *</label>
            <input type="text" name="apellido" class="form-control" value="{{ form.apellido.value|default:'' }}" required placeholder="Apellido">
          </div>
          <div class="form-group">
            <label class="form-label">Grado *</label>
            <select name="grado" class="form-control" required>
              <option value="">Seleccionar grado</option>
              {% for val, lbl in form.fields.grado.choices %}
              <option value="{{ val }}" {% if form.grado.value == val %}selected{% endif %}>{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Edad *</label>
            <input type="number" name="edad" class="form-control" value="{{ form.edad.value|default:'' }}" required placeholder="Años" min="5" max="20">
          </div>
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control" value="{{ form.email.value|default:'' }}" placeholder="correo@ejemplo.com">
          </div>
          <div class="form-group">
            <label class="form-label">Nombre del acudiente</label>
            <input type="text" name="nombre_acudiente" class="form-control" value="{{ form.nombre_acudiente.value|default:'' }}" placeholder="Nombre completo">
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono acudiente</label>
            <input type="text" name="telefono_acudiente" class="form-control" value="{{ form.telefono_acudiente.value|default:'' }}" placeholder="310 000 0000">
          </div>
          <div class="form-group full">
            <label class="form-label">Notas generales</label>
            <textarea name="notas_generales" class="form-control" rows="3" placeholder="Observaciones relevantes sobre el estudiante...">{{ form.notas_generales.value|default:'' }}</textarea>
          </div>
        </div>
        <div class="flex gap-2" style="margin-top:8px">
          <button type="submit" class="btn btn-primary">{{ accion }}</button>
          <a href="{% url 'estudiantes_list' %}" class="btn btn-outline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
