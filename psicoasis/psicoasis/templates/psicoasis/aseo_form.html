{% extends 'psicoasis/base.html' %}
{% block title %}{{ titulo }} — PsicoAsis{% endblock %}
{% block topbar_title %}{{ titulo }}{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ titulo }}</h1>
  <p>Completa la información del personal de aseo</p>
</div>

<div style="max-width:700px">
  <div class="card">
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Nombre *</label>
            <input type="text" name="nombre" class="form-control" value="{{ form.nombre.value|default:'' }}" required placeholder="Nombre">
          </div>
          <div class="form-group">
            <label class="form-label">Apellido *</label>
            <input type="text" name="apellido" class="form-control" value="{{ form.apellido.value|default:'' }}" required placeholder="Apellido">
          </div>
          <div class="form-group">
            <label class="form-label">Área asignada *</label>
            <select name="area_asignada" class="form-control" required>
              {% for val, lbl in form.fields.area_asignada.choices %}
              <option value="{{ val }}" {% if form.area_asignada.value == val %}selected{% endif %}>{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Turno *</label>
            <select name="turno" class="form-control" required>
              {% for val, lbl in form.fields.turno.choices %}
              <option value="{{ val }}" {% if form.turno.value == val %}selected{% endif %}>{{ lbl }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ form.telefono.value|default:'' }}" placeholder="310 000 0000">
          </div>
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" name="email" class="form-control" value="{{ form.email.value|default:'' }}" placeholder="correo@ejemplo.com">
          </div>
          <div class="form-group">
            <label class="form-label">Fecha de ingreso</label>
            <input type="date" name="fecha_ingreso" class="form-control" value="{{ form.fecha_ingreso.value|default:'' }}">
          </div>
          <div class="form-group full">
            <label class="form-label">Notas generales</label>
            <textarea name="notas_generales" class="form-control" rows="3" placeholder="Observaciones relevantes...">{{ form.notas_generales.value|default:'' }}</textarea>
          </div>
        </div>
        <div class="flex gap-2" style="margin-top:8px">
          <button type="submit" class="btn btn-primary">{{ accion }}</button>
          <a href="{% url 'aseo_list' %}" class="btn btn-outline">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
